{% extends "base.html" %}

{% block title %}{{ client|default_if_none:"Add client" }} | CRM Garden{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">
    {% if client %}
      Edit client
    {% else %}
      Add client
    {% endif %}
  </h1>

  <form method="post" class="card card-body">
    {% csrf_token %}

    {% include "partials/_form_fields.html" with form=form %}

    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'crm:client_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
